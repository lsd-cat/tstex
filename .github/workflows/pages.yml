name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run build
      - id: extra   # the package list lives in the packer, so the two cannot drift
        run: echo "list=$(node tools/pack-texmf.ts --list-extra | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/texlive
        with: { scheme: scheme-basic, packages: '${{ steps.extra.outputs.list }}' }
      - run: node tools/build-format.ts --texmf "$RUNNER_TEMP/tl/texmf-var" --texmf "$RUNNER_TEMP/tl/texmf-dist" --out build/latex.fmt
      - run: node tools/pack-texmf.ts --preset basic --texmf-dist "$RUNNER_TEMP/tl/texmf-dist" --texmf-var "$RUNNER_TEMP/tl/texmf-var" --fmt build/latex.fmt --out site/bundles/basic
      - run: |
          mkdir -p site/bundles
          cp -r web dist site/ && cp -r bundles/minimal site/bundles/
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=web/">' > site/index.html
      - uses: actions/configure-pages@v6   # Pages must be enabled once in the repo settings (source: GitHub Actions)
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v5
