name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - run: node --test test/unit/ test/oracle/   # no TeX Live: the oracle harness falls back to bundles/minimal
  browser:
    runs-on: ubuntu-latest
    env: { CI_BROWSERS: chromium }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test test/browser/
